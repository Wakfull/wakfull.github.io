  <script>
    // Apply the saved theme (or the OS color-scheme preference) before first paint
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    /* Small dark-mode fallback used only before the app CSS bundle loads */
    html[data-bs-theme="dark"] body { background-color: #14181f; }
    html[data-bs-theme="dark"] .navbar { background-color: #212529; }
    html[data-bs-theme="dark"] .navbar .nav-link { color: rgba(255, 255, 255, 0.65); }
    html[data-bs-theme="dark"] .navbar .nav-link:hover { color: rgba(255, 255, 255, 0.95); }
  </style>
